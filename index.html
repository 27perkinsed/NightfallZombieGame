<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nightfall: Zombie Escape</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hud" aria-label="Game status">
        <section class="hud-block hud-health">
          <div class="hud-label"><span>VITALS</span><strong><span id="health">100</span><span class="unit">%</span></strong></div>
          <div class="meter" role="progressbar" aria-label="Health" aria-valuemin="0" aria-valuemax="100">
            <span id="healthBar"></span>
          </div>
        </section>
        <section class="hud-block">
          <span class="hud-label">SCORE</span>
          <strong id="score">0</strong>
        </section>
        <section class="hud-block">
          <span class="hud-label">WAVE</span>
          <strong id="wave">1 / 3</strong>
        </section>
        <section class="hud-block hud-weapon">
          <span class="hud-label">WEAPON</span>
          <strong id="weapon">Service pistol</strong>
        </section>
        <section class="hud-block hud-ammo">
          <span class="hud-label">AMMO</span>
          <strong id="ammo">72</strong>
        </section>
        <button id="pauseButton" class="pause-button" type="button" aria-label="Pause game">Ⅱ</button>
      </header>

      <div class="game-frame">
        <section id="bossHud" class="boss-hud" hidden aria-label="Boss health">
          <span>THE NIGHTSTALKER</span>
          <div class="meter"><span id="bossHealthBar"></span></div>
        </section>
        <canvas id="gameCanvas" width="960" height="540" aria-label="Nightfall Zombie Escape game"></canvas>
        <section id="screenOverlay" class="screen-overlay" aria-live="polite">
          <div class="screen-card">
            <span class="eyebrow">NIGHTFALL · SURVIVAL PROTOCOL</span>
            <h1 id="screenTitle">NIGHTFALL</h1>
            <p id="screenMessage"></p>
            <div id="screenActions" class="screen-actions"></div>
            <p class="controls-hint">MOVE <kbd>A</kbd><kbd>D</kbd> &nbsp; JUMP <kbd>W</kbd> / <kbd>SPACE</kbd> &nbsp; FIRE <kbd>J</kbd> / CLICK &nbsp; PAUSE <kbd>ESC</kbd></p>
          </div>
        </section>
      </div>
      <footer class="game-footer">
        <span>Collect supplies. Clear every wave. Reach the extraction beacon.</span>
        <span class="sound-hint">M · SOUND ON / OFF</span>
      </footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
